            type: object
      security:
      - BearerAuth: []
      summary: Create a connector
      tags:
      - connectors
  /connectors/{id}:
    delete:
      description: Delete a database connector
      parameters:
      - description: Connector ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete a connector
      tags:
      - connectors
    put:
      consumes:
      - application/json
      description: Update a database connector's configuration
      parameters:
      - description: Connector ID
        in: path
        name: id
        required: true
        type: string
      - description: Connector updates
        in: body
        name: request
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
