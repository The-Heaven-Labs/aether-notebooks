basePath: /api/v1
definitions:
  api.adminCreateOrgRequest:
    properties:
      name:
        type: string
      slug:
        type: string
    type: object
  api.auditListResponse:
    properties:
      entries:
        items:
          $ref: '#/definitions/audit.Entry'
        type: array
      total:
        type: integer
    type: object
  api.authResponse:
    properties:
      org:
        properties:
          id:
            type: string
          name:
            type: string
          role:
            type: string
        type: object
      token:
        type: string
      user:
        properties:
          email:
            type: string
          id:
            type: string
          is_platform_admin:
            type: boolean
          name:
            type: string
        type: object
    type: object
  api.loginRequest:
    properties:
      email:
        type: string
      org_id:
        description: optional, uses first org if empty
        type: string
      password:
        type: string
    type: object
  api.motdRequest:
    properties:
      content:
        type: string
      expires_at:
        type: string
      pages:
        items:
          type: string
        type: array
      priority:
        type: integer
      show_on_login:
        type: boolean
      title:
        type: string
      visibility:
        type: string
    type: object
  api.providerResponse:
    properties:
      allowed_domains:
        items:
          type: string
        type: array
      auto_sync_groups:
        type: boolean
      client_id:
        type: string
      created_at:
        type: string
      discovery_url:
        type: string
      enabled:
        type: boolean
      get_user_info:
        type: boolean
      group_prefix:
        type: string
      groups_claim:
        type: string
      id:
        type: string
      name:
        type: string
      provider_type:
        type: string
      scope:
        type: string
      scopes:
        items:
          type: string
        type: array
      updated_at:
        type: string
    type: object
  api.recentItem:
    properties:
      id:
        type: string
      name:
        type: string
      type:
        type: string
      updated_at:
        type: string
    type: object
  api.registerRequest:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        type: string
    type: object
  api.ssoSettingsResponse:
    properties:
      sso_password_login:
        type: boolean
    type: object
  audit.Entry:
    properties:
      action:
        type: string
      created_at:
        type: string
      id:
        type: integer
      metadata:
        additionalProperties: {}
        type: object
      org_id:
        type: string
      resource_id:
        type: string
      resource_name:
        type: string
      resource_parent_name:
        type: string
      resource_type:
        type: string
      user_email:
        type: string
      user_id:
        type: string
    type: object
  models.Agent:
    properties:
      created_at:
        type: string
      created_by:
        type: string
      description:
        type: string
      folder_id:
        type: string
      id:
        type: string
      max_subagent_turns:
        type: integer
      max_subagents:
        type: integer
      max_turns:
        type: integer
      mcp_server_ids:
        items:
          type: string
        type: array
      mcp_servers:
        items:
          $ref: '#/definitions/models.MCPServerOrg'
        type: array
      model_config_id:
        type: string
      model_config_params:
        $ref: '#/definitions/models.JSONMap'
      name:
        type: string
      org_id:
        type: string
      skill_ids:
        items:
          type: string
        type: array
      skills:
        items:
          $ref: '#/definitions/models.Skill'
        type: array
      subagent_model_config_id:
        type: string
      system_prompt:
        type: string
      tool_ids:
        items:
          type: string
        type: array
      tools:
        items:
          $ref: '#/definitions/models.Tool'
        type: array
      updated_at:
        type: string
    type: object
  models.AgentSession:
    properties:
      agent_id:
        type: string
      created_at:
        type: string
      ended_at:
        type: string
      id:
        type: string
      max_turns:
        type: integer
      notebook_id:
        type: string
      title:
        type: string
      user_id:
        type: string
    type: object
  models.AgentStatsDaily:
    properties:
      agent_id:
        type: string
      date:
        type: string
      messages_count:
        type: integer
      sessions_count:
        type: integer
      tokens_input:
        type: integer
      tokens_output:
        type: integer
      user_id:
        type: string
    type: object
  models.Connector:
    properties:
      config:
        $ref: '#/definitions/models.ConnectorConfig'
      created_at:
        type: string
      deleted_at:
        type: string
      folder_id:
        type: string
      id:
        type: string
      is_default:
        type: boolean
      max_rows:
        type: integer
      name:
        type: string
      org_id:
        type: string
      table_allowlist:
        items:
          type: string
        type: array
      table_denylist:
        items:
          type: string
        type: array
      timeout_seconds:
        type: integer
      type:
        $ref: '#/definitions/models.ConnectorType'
      updated_at:
        type: string
    type: object
  models.ConnectorConfig:
    properties:
      database:
        type: string
      host:
        type: string
      password:
        type: string
      port:
        type: integer
      ssl_mode:
        type: string
      user:
        type: string
    type: object
  models.ConnectorType:
    enum:
    - postgres
    - clickhouse
    - opensearch
    type: string
    x-enum-varnames:
    - ConnectorPostgres
    - ConnectorClickHouse
    - ConnectorOpenSearch
  models.Dashboard:
    properties:
      created_at:
        type: string
      created_by:
        type: string
      deleted_at:
        type: string
      folder_id:
        type: string
      id:
        type: string
      org_id:
        type: string
      settings:
        $ref: '#/definitions/models.DashboardSettings'
      title:
        type: string
      updated_at:
        type: string
    type: object
  models.DashboardSettings:
    properties:
      auto_refresh_seconds:
        type: integer
      grid_cols:
        type: integer
      parameter_overrides:
        additionalProperties:
          type: string
        type: object
    type: object
  models.JSONMap:
    additionalProperties: {}
    type: object
  models.MCPServerOrg:
    properties:
      args:
        items:
          type: string
        type: array
      command:
        type: string
      created_at:
        type: string
      created_by:
        type: string
      id:
        type: string
      name:
        type: string
      org_id:
        type: string
      type:
        type: string
      updated_at:
        type: string
    type: object
  models.ModelConfig:
    properties:
      base_url:
        type: string
      context_window:
        type: integer
      created_at:
        type: string
      created_by:
        type: string
      default_params:
        $ref: '#/definitions/models.JSONMap'
      folder_id:
        type: string
      id:
        type: string
      model:
        type: string
      name:
        type: string
      org_id:
        type: string
      price_per_cache_read_token:
        type: number
      price_per_input_token:
        type: number
      price_per_output_token:
        type: number
      provider:
        type: string
      updated_at:
        type: string
    type: object
  models.Notebook:
    properties:
      connector_id:
        type: string
      created_at:
        type: string
      created_by:
        type: string
      deleted_at:
        type: string
      description:
        type: string
      folder_id:
        type: string
      id:
        type: string
      org_id:
        type: string
      parameters:
        items:
          $ref: '#/definitions/models.Parameter'
        type: array
      title:
        type: string
      updated_at:
        type: string
    type: object
  models.Parameter:
    properties:
      default:
        type: string
      name:
        type: string
      type:
        type: string
    type: object
  models.Skill:
    properties:
      created_at:
        type: string
      created_by:
        type: string
      description:
        type: string
      folder_id:
        type: string
      id:
        type: string
      name:
        type: string
      org_id:
        type: string
      system_prompt:
        type: string
      updated_at:
        type: string
    type: object
  models.Tool:
    properties:
      config:
        $ref: '#/definitions/models.JSONMap'
      created_at:
        type: string
      created_by:
        type: string
      description:
        type: string
      folder_id:
        type: string
      id:
        type: string
      name:
        type: string
      org_id:
        type: string
      require_confirmation:
        type: boolean
      schema:
        $ref: '#/definitions/models.JSONMap'
      type:
        $ref: '#/definitions/models.ToolType'
      updated_at:
        type: string
    type: object
  models.ToolType:
    enum:
    - builtin
    - webhook
    - sql_query
    type: string
    x-enum-varnames:
    - ToolTypeBuiltin
    - ToolTypeWebhook
    - ToolTypeSQLQuery
  models.User:
    properties:
      created_at:
        type: string
      email:
        type: string
      email_verified:
        type: boolean
      id:
        type: string
      is_platform_admin:
        type: boolean
      name:
        type: string
      status:
        type: string
      theme:
        type: string
      updated_at:
        type: string
    type: object
  models.Widget:
    properties:
      cell_id:
        type: string
      config:
        additionalProperties: true
        type: object
      created_at:
        type: string
      dashboard_id:
        type: string
      id:
        type: string
      layout:
        $ref: '#/definitions/models.WidgetLayout'
      notebook_id:
        type: string
      type:
        $ref: '#/definitions/models.WidgetType'
      updated_at:
        type: string
    type: object
  models.WidgetLayout:
    properties:
      col:
        type: integer
      height:
        type: integer
      row:
        type: integer
      width:
        type: integer
    type: object
  models.WidgetType:
    enum:
    - chart
    - table
    - text
    - metric
    - date_picker
    - date_range
    - freetext
    - number
    - multi_select
    type: string
    x-enum-varnames:
    - WidgetChart
    - WidgetTable
    - WidgetText
    - WidgetMetric
    - WidgetDatePicker
    - WidgetDateRange
    - WidgetFreetext
    - WidgetNumber
    - WidgetMultiSelect
host: localhost:8088
info:
  contact: {}
  description: Aether Notebooks API — collaborative SQL/data notebook platform
  title: Aether API
  version: 1.0.0
paths:
  /acl/{resource_type}/{resource_id}:
    get:
      description: Get access control list for a resource
      parameters:
      - description: Resource type
        in: path
        name: resource_type
        required: true
        type: string
      - description: Resource ID
        in: path
        name: resource_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              type: object
            type: array
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get ACL
      tags:
      - permissions
    put:
      consumes:
      - application/json
      description: Update access control list for a resource
      parameters:
      - description: Resource type
        in: path
        name: resource_type
        required: true
        type: string
      - description: Resource ID
        in: path
        name: resource_id
        required: true
        type: string
      - description: ACL entries
        in: body
        name: request
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update ACL
      tags:
      - permissions
  /admin/motd:
    get:
      description: Get all MOTD messages including expired ones (admin only)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              additionalProperties: true
              type: object
            type: array
      security:
      - BearerAuth: []
      summary: List all MOTD (admin)
      tags:
      - motd
    post:
      consumes:
      - application/json
      description: Create a new Message of the Day (admin only)
      parameters:
      - description: MOTD message fields
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.motdRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create MOTD message
      tags:
      - motd
  /admin/motd/{id}:
    delete:
      description: Delete an MOTD message (admin only)
      parameters:
      - description: MOTD ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete MOTD message
      tags:
      - motd
    put:
      consumes:
      - application/json
      description: Update an existing MOTD message (admin only)
      parameters:
      - description: MOTD ID
        in: path
        name: id
        required: true
        type: string
      - description: Updated MOTD fields
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.motdRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update MOTD message
      tags:
      - motd
  /admin/sso/providers:
    get:
      description: List all platform-level SSO providers
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List SSO providers
      tags:
      - sso
    post:
      consumes:
      - application/json
      description: Create a new platform-level SSO provider
      parameters:
      - description: SSO provider details
        in: body
        name: request
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/api.providerResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create SSO provider
      tags:
      - sso
  /admin/sso/providers/{id}:
    delete:
      description: Delete a platform-level SSO provider
      parameters:
      - description: Provider ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete SSO provider
      tags:
      - sso
    put:
      consumes:
      - application/json
      description: Update a platform-level SSO provider
      parameters:
      - description: Provider ID
        in: path
        name: id
        required: true
        type: string
      - description: SSO provider details
        in: body
        name: request
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.providerResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update SSO provider
      tags:
      - sso
  /admin/sso/providers/{id}/test:
    post:
      description: Test connectivity to an OIDC provider by fetching its discovery
        document
      parameters:
      - description: Provider ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Test SSO provider
      tags:
      - sso
  /agent-attachments/{id}:
    get:
      description: Retrieve an image attachment for an agent session
      parameters:
      - description: Attachment ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/octet-stream
      responses:
        "200":
          description: OK
          schema:
            type: file
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get agent session attachment
      tags:
      - agents
  /agent-sessions/{session_id}/attachments:
    post:
      consumes:
      - multipart/form-data
      description: Upload an image attachment for an agent session (vision support)
      parameters:
      - description: Session ID
        in: path
        name: session_id
        required: true
        type: string
      - description: Image file to upload
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Upload agent session attachment
      tags:
      - agents
  /agents:
    get:
      description: List all agents for the current organization
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Agent'
            type: array
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List agents
      tags:
      - agents
    post:
      consumes:
      - application/json
      description: Create a new agent configuration
      parameters:
      - description: Agent details
        in: body
        name: request
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create an agent
      tags:
      - agents
  /agents/{id}:
    delete:
      description: Delete an agent configuration
      parameters:
      - description: Agent ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete an agent
      tags:
      - agents
    get:
      description: Get a single agent by ID
      parameters:
      - description: Agent ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Agent'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get an agent
      tags:
      - agents
    put:
      consumes:
      - application/json
      description: Update an existing agent configuration
      parameters:
      - description: Agent ID
        in: path
        name: id
        required: true
        type: string
      - description: Agent updates
        in: body
        name: request
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update an agent
      tags:
      - agents
  /agents/{id}/session:
    post:
      consumes:
      - application/json
      description: Create a new chat session with an agent
      parameters:
      - description: Agent ID
        in: path
        name: id
        required: true
        type: string
      - description: Session details
        in: body
        name: request
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create an agent session
      tags:
      - agents
  /agents/{id}/sessions:
    get:
      description: List all sessions for a given agent
      parameters:
      - description: Agent ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              type: object
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List agent sessions
      tags:
      - agents
  /agents/{id}/stats:
    get:
      description: Get usage statistics for a specific agent
      parameters:
      - description: Agent ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.AgentStatsDaily'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get agent stats by agent
      tags:
      - agents
  /agents/stats:
    get:
      description: Get usage statistics for all agents in the organization
      produces:
      - application/json
      responses:
        "200":
          description: OK
