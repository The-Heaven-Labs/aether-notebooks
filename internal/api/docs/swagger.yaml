basePath: /api/v1
definitions:
  api.authResponse:
    properties:
      org:
        properties:
          id:
            type: string
          name:
            type: string
          role:
            type: string
        type: object
      token:
        type: string
      user:
        properties:
          email:
            type: string
          id:
            type: string
          is_platform_admin:
            type: boolean
          name:
            type: string
        type: object
    type: object
  api.loginRequest:
    properties:
      email:
        type: string
      org_id:
        description: optional, uses first org if empty
        type: string
      password:
        type: string
    type: object
  api.registerRequest:
    properties:
      email:
        type: string
      name:
        type: string
      org_name:
        type: string
      password:
        type: string
    type: object
  models.Connector:
    properties:
      config:
        $ref: '#/definitions/models.ConnectorConfig'
      created_at:
        type: string
      folder_id:
        type: string
      id:
        type: string
      is_default:
        type: boolean
      max_rows:
        type: integer
      name:
        type: string
      org_id:
        type: string
      table_allowlist:
        items:
          type: string
        type: array
      table_denylist:
        items:
          type: string
        type: array
      timeout_seconds:
        type: integer
      type:
        $ref: '#/definitions/models.ConnectorType'
      updated_at:
        type: string
    type: object
  models.ConnectorConfig:
    properties:
      database:
        type: string
      host:
        type: string
      password:
        type: string
      port:
        type: integer
      ssl_mode:
        type: string
      user:
        type: string
    type: object
  models.ConnectorType:
    enum:
    - postgres
    - clickhouse
    - opensearch
    type: string
    x-enum-varnames:
    - ConnectorPostgres
    - ConnectorClickHouse
    - ConnectorOpenSearch
  models.Dashboard:
    properties:
      created_at:
        type: string
      created_by:
        type: string
      folder_id:
        type: string
      id:
        type: string
      org_id:
        type: string
      public_token:
        type: string
      settings:
        $ref: '#/definitions/models.DashboardSettings'
      title:
        type: string
      updated_at:
        type: string
    type: object
  models.DashboardSettings:
    properties:
      auto_refresh_seconds:
        type: integer
      grid_cols:
        type: integer
      parameter_overrides:
        additionalProperties:
          type: string
        type: object
    type: object
  models.Notebook:
    properties:
      connector_id:
        type: string
      created_at:
        type: string
      created_by:
        type: string
      description:
        type: string
      folder_id:
        type: string
      id:
        type: string
      org_id:
        type: string
      parameters:
        items:
          $ref: '#/definitions/models.Parameter'
        type: array
      title:
        type: string
      updated_at:
        type: string
    type: object
  models.Parameter:
    properties:
      default:
        type: string
      name:
        type: string
      type:
        type: string
    type: object
  models.User:
    properties:
      created_at:
        type: string
      email:
        type: string
      email_verified:
        type: boolean
      id:
        type: string
      is_platform_admin:
        type: boolean
      name:
        type: string
      status:
        type: string
      theme:
        type: string
      updated_at:
        type: string
    type: object
  models.Widget:
    properties:
      cell_id:
        type: string
      config:
        additionalProperties: true
        type: object
      created_at:
        type: string
      dashboard_id:
        type: string
      id:
        type: string
      layout:
        $ref: '#/definitions/models.WidgetLayout'
      notebook_id:
        type: string
      type:
        $ref: '#/definitions/models.WidgetType'
      updated_at:
        type: string
    type: object
  models.WidgetLayout:
    properties:
      col:
        type: integer
      height:
        type: integer
      row:
        type: integer
      width:
        type: integer
    type: object
  models.WidgetType:
    enum:
    - chart
    - table
    - text
    - metric
    - date_picker
    - date_range
    - freetext
    - number
    - multi_select
    type: string
    x-enum-varnames:
    - WidgetChart
    - WidgetTable
    - WidgetText
    - WidgetMetric
    - WidgetDatePicker
    - WidgetDateRange
    - WidgetFreetext
    - WidgetNumber
    - WidgetMultiSelect
host: localhost:8080
info:
  contact: {}
  description: Heaven's Notebooks API — collaborative SQL/data notebook platform
  title: hnb API
  version: 1.0.0
paths:
  /acl/{resource_type}/{resource_id}:
    get:
      description: Get access control list for a resource
      parameters:
      - description: Resource type
        in: path
        name: resource_type
        required: true
        type: string
      - description: Resource ID
        in: path
        name: resource_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              type: object
            type: array
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get ACL
      tags:
      - permissions
    put:
      consumes:
      - application/json
      description: Update access control list for a resource
      parameters:
      - description: Resource type
        in: path
        name: resource_type
        required: true
        type: string
      - description: Resource ID
        in: path
        name: resource_id
        required: true
        type: string
      - description: ACL entries
        in: body
        name: request
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update ACL
      tags:
      - permissions
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate a user and return a JWT token
      parameters:
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.loginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.authResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Login with email and password
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Create a new user account
      parameters:
      - description: Registration details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.registerRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/api.authResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Register a new user
      tags:
      - auth
  /connectors:
    get:
      description: List all connectors for the current organization
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Connector'
            type: array
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List connectors
      tags:
      - connectors
    post:
      consumes:
      - application/json
      description: Create a new database connector
      parameters:
      - description: Connector details
        in: body
        name: request
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
