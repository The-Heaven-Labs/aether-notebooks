name: hnb-dev

# ─────────────────────────────────────────────────────────────────────────────
# Development stack — a single `docker compose -f docker-compose.dev.yml up`
# starts every service with live-reload:
#
#   • api    — Go server via Air; rebuilds on any *.go change
#   • relay  — Hocuspocus TypeScript server via tsx --watch
#   • web    — Vite dev server with HMR
#   • postgres, redis — infrastructure (data persists in named volumes)
#
# Browser entry point: http://localhost:5173
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Infrastructure ───────────────────────────────────────────────────────

  hnb-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hnb
      POSTGRES_PASSWORD: hnb_dev
      POSTGRES_DB: hnb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hnb -d hnb"]
      interval: 5s
      timeout: 5s
      retries: 10

  hnb-redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  hnb-clickhouse:
    image: clickhouse/clickhouse-server:24-alpine
    ports:
      - "9000:9000"   # native protocol (used by the Go connector)
      - "8123:8123"   # HTTP interface (useful for curl / DBeaver)
    environment:
      CLICKHOUSE_DB: analytics
      CLICKHOUSE_USER: dev
      CLICKHOUSE_PASSWORD: dev
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - ./dev/clickhouse-seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro
      - ./dev/clickhouse-seed-cloudtrail.sql:/docker-entrypoint-initdb.d/seed-cloudtrail.sql:ro
      - chdata:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user dev --password dev --query 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 20

  hnb-opensearch:
    image: opensearchproject/opensearch:2.19.0
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - plugins.sql.enabled=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - osdata:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  # ── CloudTrail log loader (one-shot, runs on first startup) ────────────

  cloudtrail-loader:
    image: python:3-alpine
    volumes:
      - ./dev/cloudtrail-logs:/logs:ro
      - ./dev/scripts/load-cloudtrail.py:/app/load-cloudtrail.py:ro
    environment:
      CLICKHOUSE_HOST: hnb-clickhouse
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_DB: analytics
      CLICKHOUSE_USER: dev
      CLICKHOUSE_PASSWORD: dev
      LOGS_DIR: /logs
      BATCH_SIZE: "5000"
      # MAX_FILES: "3"   # Uncomment to limit number of files processed
    depends_on:
      hnb-clickhouse:
        condition: service_healthy
    entrypoint: ["python3", "/app/load-cloudtrail.py"]
    # Service exits after loading; use `docker compose up cloudtrail-loader`
    # to re-run if you change MAX_FILES or reset the ClickHouse volume.

  opensearch-loader:
    image: alpine:3.20
    depends_on:
      hnb-opensearch:
        condition: service_healthy
    volumes:
      - ./dev/opensearch-seed.sh:/seed.sh:ro
    entrypoint: ["sh", "/seed.sh"]

  # ── API server (Go + Air hot-reload) ─────────────────────────────────────

  dex:
    image: ghcr.io/dexidp/dex:v2.38.0
    command: dex serve /etc/dex/config.yaml
    ports:
      - "5556:5556"
    volumes:
      - ./dev/dex-config.yaml:/etc/dex/config.yaml:ro

  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "8080:8080"
    environment:
      HNB_DATABASE_URL: postgres://hnb:hnb_dev@hnb-postgres:5432/hnb?sslmode=disable
      HNB_REDIS_URL: redis://hnb-redis:6379
      HNB_MASTER_KEY: dev-master-key-change-in-production
      HNB_JWT_SECRET: dev-jwt-secret-change-in-production
      HNB_PLATFORM_ADMIN_EMAIL: admin@heaven-labs.com
      HNB_PUBLIC_URL: http://localhost:8080
      HNB_FRONTEND_URL: http://localhost:5173
    volumes:
      # Mount entire repo so Air can watch and rebuild on Go file changes.
      # Named volumes for the Go caches survive container restarts, making
      # incremental rebuilds fast.
      - .:/app
      - go-build-cache:/root/.cache/go-build
      - go-mod-cache:/go/pkg/mod
    # alpine's busybox includes nc — check that the Go server is actually
    # accepting connections before dependants try to proxy through it.
    # start_period gives Air time to compile on the first run (~20-40s).
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8080"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 60s
    depends_on:
      hnb-postgres:
        condition: service_healthy
      hnb-redis:
        condition: service_started

  # ── Hocuspocus relay (TypeScript + tsx --watch) ───────────────────────────

  relay:
    build:
      context: ./relay
      dockerfile: Dockerfile.dev
    ports:
      - "3001:3001"
    environment:
      HNB_API_URL: http://api:8080
      HNB_RELAY_PORT: "3001"
    volumes:
      # Mount the whole relay directory; keep node_modules in a named volume
      # so the container-built binaries aren't overwritten by the host.
      - ./relay:/app
      - relay-node-modules:/app/node_modules
    depends_on:
      - api

  # ── Web dev server (Vite HMR) ────────────────────────────────────────────

  web:
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    environment:
      # Vite (running inside this container) proxies /api and /internal to the
      # API service on the internal Docker network.
      API_URL: http://api:8080
    volumes:
      - ./web:/app
      - web-node-modules:/app/node_modules
    depends_on:
      api:
        condition: service_healthy
      relay:
        condition: service_started

volumes:
  pgdata:
  chdata:
  osdata:
  go-build-cache:
  go-mod-cache:
  relay-node-modules:
  web-node-modules:
