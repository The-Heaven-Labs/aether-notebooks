name: aether-dev

# ─────────────────────────────────────────────────────────────────────────────
# Development stack — a single `docker compose -f docker-compose.dev.yml up`
# starts every service with live-reload:
#
#   • api    — Go server via Air; rebuilds on any *.go or web/dist change
#   • web-builder — Builds web assets with Vite; auto-rebuilds on source changes
#   • relay  — Hocuspocus TypeScript server via tsx --watch
#   • postgres, redis — infrastructure (data persists in named volumes)
#
# Browser entry point: http://localhost:8088 (api serves API + frontend)
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Infrastructure ───────────────────────────────────────────────────────

  aether-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aether
      POSTGRES_PASSWORD: aether_dev
      POSTGRES_DB: aether
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aether -d aether"]
      interval: 5s
      timeout: 5s
      retries: 10

  aether-redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  aether-clickhouse:
    image: clickhouse/clickhouse-server:24-alpine
    ports:
      - "9000:9000"   # native protocol (used by the Go connector)
      - "8123:8123"   # HTTP interface (useful for curl / DBeaver)
    environment:
      CLICKHOUSE_DB: analytics
      CLICKHOUSE_USER: dev
      CLICKHOUSE_PASSWORD: dev
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - ./dev/clickhouse-seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro
      - ./dev/clickhouse-seed-cloudtrail.sql:/docker-entrypoint-initdb.d/seed-cloudtrail.sql:ro
      - ./dev/clickhouse-seed-linux-processes.sql:/docker-entrypoint-initdb.d/seed-linux-processes.sql:ro
      - ./dev/clickhouse-seed-timeline.sql:/docker-entrypoint-initdb.d/seed-timeline.sql:ro
      - ./dev/clickhouse-seed-map.sql:/docker-entrypoint-initdb.d/seed-map.sql:ro
      - ./dev/clickhouse-seed-sankey.sql:/docker-entrypoint-initdb.d/seed-sankey.sql:ro
      - chdata:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user dev --password dev --query 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 20

  aether-opensearch:
    image: opensearchproject/opensearch:2.19.0
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - plugins.sql.enabled=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - osdata:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  # ── CloudTrail log loader (one-shot, runs on first startup) ────────────

  cloudtrail-loader:
    image: python:3-alpine
    volumes:
      - ./dev/cloudtrail-logs:/logs:ro
      - ./dev/scripts/load-cloudtrail.py:/app/load-cloudtrail.py:ro
    environment:
      CLICKHOUSE_HOST: aether-clickhouse
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_DB: analytics
      CLICKHOUSE_USER: dev
      CLICKHOUSE_PASSWORD: dev
      LOGS_DIR: /logs
      BATCH_SIZE: "5000"
      # MAX_FILES: "3"   # Uncomment to limit number of files processed
    depends_on:
      aether-clickhouse:
        condition: service_healthy
    entrypoint: ["python3", "/app/load-cloudtrail.py"]
    # Service exits after loading; use `docker compose up cloudtrail-loader`
    # to re-run if you change MAX_FILES or reset the ClickHouse volume.

  opensearch-loader:
    image: alpine:3.20
    depends_on:
      aether-opensearch:
        condition: service_healthy
    volumes:
      - ./dev/opensearch-seed.sh:/seed.sh:ro
    entrypoint: ["sh", "-c", "apk add --no-cache curl >/dev/null 2>&1 && sh /seed.sh"]

  # ── API server (Go + Air hot-reload) ─────────────────────────────────────

  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    command: start-dev --import-realm
    ports:
      - "5557:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin123
      KC_HTTP_PORT: "8080"
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: "5557"
      KC_HOSTNAME_STRICT: "false"
    volumes:
      - ./dev/keycloak-realm.json:/opt/keycloak/data/import/keycloak-realm.json:ro

  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "8088:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      AETHER_DATABASE_URL: postgres://aether:aether_dev@aether-postgres:5432/aether?sslmode=disable
      AETHER_REDIS_URL: redis://aether-redis:6379
      AETHER_MASTER_KEY: dev-master-key-change-in-production
      AETHER_JWT_SECRET: dev-jwt-secret-change-in-production
      AETHER_PLATFORM_ADMIN_EMAIL: admin@heaven-labs.com
      AETHER_PUBLIC_URL: http://localhost:8088
      AETHER_FRONTEND_URL: http://localhost:8088
      AETHER_PORT: "8080"
      AETHER_OIDC_HOST_REWRITE: localhost:5557=host.docker.internal:5557
      AETHER_STORAGE_BACKEND: s3
      AETHER_S3_ENDPOINT: http://aether-garage:3900
      AETHER_S3_BUCKET: aether-attachments
      AETHER_S3_REGION: us-east-1
      AETHER_S3_ACCESS_KEY: GKacc5e39c17a68ea60adf92db
      AETHER_S3_SECRET_KEY: 557351ff6f3e11eb8a1810af9647f9af9d3b0ce2e5786d2b186d327f091ab65c
    volumes:
      # Mount entire repo so Air can watch and rebuild on Go file changes.
      # Named volumes for the Go caches survive container restarts, making
      # incremental rebuilds fast.
      - .:/app
      - go-build-cache:/root/.cache/go-build
      - go-mod-cache:/go/pkg/mod
      - ./web/dist:/app/cmd/aether-server/frontend-dist
    # alpine's busybox includes nc — check that the Go server is actually
    # accepting connections before dependants try to proxy through it.
    # start_period gives Air time to compile on the first run (~20-40s).
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8080"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 60s
    depends_on:
      aether-postgres:
        condition: service_healthy
      aether-redis:
        condition: service_started
      web-builder:
        condition: service_started
      aether-garage:
        condition: service_healthy

  # ── Hocuspocus relay (TypeScript + tsx --watch) ───────────────────────────

  relay:
    build:
      context: ./relay
      dockerfile: Dockerfile.dev
    ports:
      - "3001:3001"
    environment:
      AETHER_API_URL: http://api:8080
      AETHER_RELAY_PORT: "3001"
    volumes:
      # Mount the whole relay directory; keep node_modules in a named volume
      # so the container-built binaries aren't overwritten by the host.
      - ./relay:/app
      - relay-node-modules:/app/node_modules
    depends_on:
      - api

  # ── S3-compatible storage (Garage) ────────────────────────────────────────

  aether-garage:
    image: dxflrs/garage:v1.0.1
    command: ["/garage", "-c", "/etc/garage/config.toml", "server"]
    ports:
      - "3900:3900"   # S3 API
    volumes:
      - ./dev/garage/config.toml:/etc/garage/config.toml:ro
      - garagedata:/var/lib/garage
    healthcheck:
      test: ["CMD", "/garage", "-c", "/etc/garage/config.toml", "status"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 15s

  garage-setup:
    image: alpine:3.20
    environment:
      ADMIN: http://aether-garage:3903
      TOKEN: dev-admin-token
    volumes:
      - ./dev/garage/seed.sh:/seed.sh:ro
    depends_on:
      aether-garage:
        condition: service_healthy
    entrypoint: ["sh", "-c", "apk add --no-cache curl >/dev/null 2>&1 && sh /seed.sh"]

  web-builder:
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    volumes:
      - ./web:/app
      - web-node-modules:/app/node_modules
    # No ports — outputs web/dist for the api container to serve

volumes:
  pgdata:
  chdata:
  osdata:
  garagedata:
  go-build-cache:
  go-mod-cache:
  relay-node-modules:
  web-node-modules:
