services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hnb
      POSTGRES_PASSWORD: hnb_dev
      POSTGRES_DB: hnb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
