services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hnb
      POSTGRES_PASSWORD: hnb_dev
      POSTGRES_DB: hnb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  clickhouse:
    image: clickhouse/clickhouse-server:24-alpine
    ports:
      - "9000:9000"
      - "8123:8123"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  relay:
    build: ./relay
    ports:
      - "3001:3001"
    environment:
      HNB_API_URL: http://api:8080
      HNB_RELAY_PORT: "3001"
    depends_on:
      - postgres

volumes:
  pgdata:
