version: 2
project_name: aether

before:
  hooks:
    - npm --prefix web run build
    - mkdir -p cmd/aether-server/frontend-dist
    - cp -r web/dist/. cmd/aether-server/frontend-dist/

builds:
  - id: server
    binary: aether-server
    main: ./cmd/aether-server
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

  - id: cli
    binary: aether
    main: ./cmd/aether
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - id: release
    name_template: "{{ .ProjectName }}_{{ .Tag }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
    format_overrides:
      - goos: windows
        format: zip

checksum:
  name_template: "checksums.txt"

dockers:
  - image_templates:
      - "ghcr.io/the-heaven-labs/aether-server:{{ .Tag }}"
      - "ghcr.io/the-heaven-labs/aether-server:latest"
    dockerfile: Dockerfile.goreleaser
    use: buildx
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--label=org.opencontainers.image.title=aether-server"
      - "--label=org.opencontainers.image.source=https://github.com/the-heaven-labs/aether-notebooks"
      - "--label=org.opencontainers.image.version={{ .Tag }}"
    goos: linux
    goarch: amd64
    ids:
      - server

release:
  github:
    owner: The-Heaven-Labs
    name: aether-notebooks
