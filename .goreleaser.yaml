version: 2
project_name: aether

before:
  hooks:
    - cd web && npm ci && npm run build
    - mkdir -p cmd/aether-server/frontend-dist
    - cp -r web/dist/* cmd/aether-server/frontend-dist/

builds:
  - id: server
    binary: aether-server
    main: ./cmd/aether-server
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

  - id: cli
    binary: aether
    main: ./cmd/aether
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - id: release
    name_template: "{{ .ProjectName }}_{{ .Tag }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
    format_overrides:
      - goos: windows
        format: zip

checksum:
  name_template: "checksums.txt"

release:
  github:
    owner: The-Heaven-Labs
    name: aether-notebooks
