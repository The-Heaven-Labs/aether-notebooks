root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -buildvcs=false -o ./tmp/main ./cmd/aether-server"
  bin = "./tmp/main"
  delay = 1000
  exclude_dir = ["tmp", "bin", "relay", "docs", "e2e"]
  include_ext = ["go", "css", "js", "html", "json", "svg", "png", "ico", "sql"]
  exclude_regex = ["_test\\.go$"]
  log = "build-errors.log"
  kill_delay = "2s"
  send_interrupt = true

[log]
  time = true

[color]
  build   = "yellow"
  runner  = "green"
  watcher = "cyan"
  app     = ""

[screen]
  clear_on_rebuild = false
  keep_scroll      = true
