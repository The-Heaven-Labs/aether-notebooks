name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  AETHER_MASTER_KEY: test-master-key-for-ci-at-least-32-bytes!!
  AETHER_JWT_SECRET: test-jwt-secret-for-ci

jobs:
  go-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aether
          POSTGRES_PASSWORD: aether_dev
          POSTGRES_DB: aether
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - run: go mod download
      - run: go vet ./...
      - run: go test ./internal/api/... ./internal/agent/... ./internal/executor/... ./internal/database/... -v -count=1 -p 1
        env:
          AETHER_DATABASE_URL: postgres://aether:aether_dev@localhost:5432/aether?sslmode=disable
          AETHER_REDIS_URL: redis://localhost:6379
      - run: go test ./internal/audit/... ./internal/auth/... ./internal/cache/... ./internal/crypto/... ./internal/scheduler/... ./internal/sso/... -v -count=1


  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - run: cd web && npm ci
      - run: cd web && npx tsc --noEmit
      - run: cd web && npm run build
      - run: cd web && npm run test:run

  relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: relay/package-lock.json
      - run: cd relay && npm ci
      - run: cd relay && npm run build

  e2e-smoke:
    runs-on: ubuntu-latest
    needs: [go-test]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aether
          POSTGRES_PASSWORD: aether_dev
          POSTGRES_DB: aether
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - run: go build -o /tmp/aether-server ./cmd/aether-server
        env:
          CGO_ENABLED: '0'
      - name: Start API server
        run: |
          /tmp/aether-server &
          SERVER_PID=$!
          echo "SERVER_PID=$SERVER_PID" >> $GITHUB_ENV
          # Wait for server to be ready
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/health > /dev/null 2>&1; then
              echo "Server ready"
              break
            fi
            sleep 1
          done
        env:
          AETHER_DATABASE_URL: postgres://aether:aether_dev@localhost:5432/aether?sslmode=disable
          AETHER_REDIS_URL: redis://localhost:6379
          AETHER_MASTER_KEY: test-master-key-for-ci-at-least-32-bytes!!
          AETHER_JWT_SECRET: test-jwt-secret-for-ci
      - name: Run smoke test
        run: bash e2e/smoke_test.sh
        env:
          AETHER_API_URL: http://localhost:8080


